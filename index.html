<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome — Disha & Rajat (#rishta)</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=3">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=20261101a">
  <link rel="stylesheet" href="css/passcode.css?v=20260930c">

  <!-- Firebase: the shared guest list lives in Firestore -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js?v=20261020a"></script>
</head>
<body class="passcode-body">
  <div class="lights-overlay"></div>

  <div class="passcode-container">
    <div class="card passcode-card">
      <div class="passcode-photo-frame">
        <img src="images/couple-stairs.jpg" alt="Disha and Rajat">
      </div>
      <div class="hero-script-heading">#rishta</div>
      <h2 class="gold-title">Welcome</h2>
      <p class="passcode-sub">Enter the invite code from your invitation, or your name, to open your invite.</p>

      <div id="invite-error" class="error-msg" style="display:none;"></div>

      <form id="code-form" onsubmit="handleCodeSubmit(event)">
        <div class="form-group">
          <input type="text" id="invite-code-input" placeholder="Invite code (e.g. FAM01)" autocomplete="off" autocapitalize="characters" spellcheck="false" style="text-align:center; letter-spacing:2px; text-transform:uppercase;">
        </div>
        <button type="submit" class="btn-primary" style="width:100%;">Continue</button>
      </form>

      <div class="invite-divider">or</div>

      <form id="name-form" onsubmit="handleNameSubmit(event)">
        <div class="invite-row">
          <div class="form-group">
            <input type="text" id="invite-first" placeholder="First name" autocomplete="given-name">
          </div>
          <div class="form-group">
            <input type="text" id="invite-last" placeholder="Last name" autocomplete="family-name">
          </div>
        </div>
        <button type="submit" class="btn-gold-outline" style="width:100%;">Find by name</button>
      </form>

      <p class="passcode-sub" style="margin-top:20px; font-size:0.8rem;">No tabs are visible until your invite is unlocked.</p>
    </div>
  </div>

  <script src="js/guest-auth.js?v=20261101a"></script>
  <script>
    function showError(msg) {
      const el = document.getElementById('invite-error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    // Where to send the guest after unlocking. Honors ?next= from pages
    // that bounced here (e.g. index.html?next=lookbook.html).
    // Only same-directory .html pages — never external URLs.
    function returnTarget() {
      const params = new URLSearchParams(location.search);
      const next = (params.get('next') || '').trim();
      if (/^[\w.\-]+\.html(\?.*)?$/.test(next)) return next;
      return 'home.html';
    }

    async function refreshGuestDb() {
      try {
        if (window.GuestAuth.ensureGuestDatabase) await window.GuestAuth.ensureGuestDatabase();
      } catch (e) {}
    }

    function hideError() {
      document.getElementById('invite-error').style.display = 'none';
    }

    // While a live check runs, the button shows progress instead of
    // letting a slow connection look like a failure. Slow connections
    // get time to finish — there is no short timeout on a login check.
    let slowTimer = null;
    function setChecking(btn, on) {
      if (!btn) return;
      clearTimeout(slowTimer);
      if (on) {
        if (!btn.dataset.label) btn.dataset.label = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Checking…';
        slowTimer = setTimeout(() => { btn.textContent = 'Still checking — slow connection…'; }, 6000);
      } else {
        btn.disabled = false;
        if (btn.dataset.label) btn.textContent = btn.dataset.label;
      }
    }

    const CONNECTION_MSG = "We couldn't check that just now — the connection seems too slow or offline. Please wait a moment and try again.";

    // Every login attempt checks Firestore directly, at that moment —
    // never a local download that may not have finished. If Firestore
    // can't be reached at all, the local cache (when this device has
    // one) is the fallback, and a miss then shows the connection
    // message above rather than a false "not found".
    async function trySignInWithCode(code, btn) {
      code = (code || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!code) { showError('Please enter your invite code.'); return; }
      hideError();
      setChecking(btn, true);
      let fam = null, checkedLive = false;
      try {
        fam = await window.GuestAuth.findFamilyByCodeLive(code);
        checkedLive = true;
      } catch (e) {
        fam = window.GuestAuth.findFamilyByCode(code);
      }
      setChecking(btn, false);
      if (!fam) {
        showError(checkedLive
          ? "We couldn't find that invite code. Please check it and try again."
          : CONNECTION_MSG);
        return;
      }
      window.GuestAuth.signInFamily(fam);
      window.location.href = returnTarget();
    }

    function handleCodeSubmit(e) {
      e.preventDefault();
      trySignInWithCode(
        document.getElementById('invite-code-input').value,
        document.querySelector('#code-form button'));
    }

    async function handleNameSubmit(e) {
      e.preventDefault();
      const first = document.getElementById('invite-first').value.trim();
      const last = document.getElementById('invite-last').value.trim();
      if (!first || !last) { showError('Please enter both your first and last name.'); return; }
      hideError();
      const btn = document.querySelector('#name-form button');
      setChecking(btn, true);
      let result = null, checkedLive = false;
      try {
        result = await window.GuestAuth.findFamilyByNameLive(first, last);
        checkedLive = true;
      } catch (err) {
        result = window.GuestAuth.findFamilyByName(first, last);
      }
      setChecking(btn, false);
      if (!result) {
        showError(checkedLive
          ? "We couldn't find that name. Try the name on your invitation, or use your invite code."
          : CONNECTION_MSG);
        return;
      }
      if (result.ambiguous) {
        showError('More than one guest has that name. Please use the invite code from your invitation.');
        return;
      }
      const member = window.GuestAuth.findFamilyMember(result, first, last);
      window.GuestAuth.signInFamily(result, member);
      window.location.href = returnTarget();
    }

    (async function init() {
      const params = new URLSearchParams(location.search);
      // Personal invite links like ?invite=FAM01 — checked live against
      // Firestore (a single-document query), with the local cache as
      // fallback if Firestore can't be reached.
      if (params.has('invite')) {
        const code = params.get('invite').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
        let fam = null;
        try { fam = await window.GuestAuth.findFamilyByCodeLive(code); }
        catch (e) { fam = window.GuestAuth.findFamilyByCode(code); }
        if (fam) {
          window.GuestAuth.signInFamily(fam);
          const target = returnTarget();
          history.replaceState(null, '', location.pathname);
          window.location.href = target;
          return;
        }
      }
      // Already unlocked
      if (window.GuestAuth.isUnlocked()) {
        window.location.href = returnTarget();
        return;
      }
      // Returning guest on this device: restore from the stored code,
      // checking the local list first and Firestore if it isn't there.
      const stored = window.GuestAuth.getStoredCode();
      if (stored) {
        let fam = window.GuestAuth.findFamilyByCode(stored);
        if (!fam) {
          try { fam = await window.GuestAuth.findFamilyByCodeLive(stored); } catch (e) {}
        }
        if (fam) {
          window.GuestAuth.signInFamily(fam);
          window.location.href = returnTarget();
          return;
        }
      }
      // Warm the local guest-list cache in the background (used as the
      // offline fallback and by later pages); login checks above and on
      // the forms don't wait on it — they ask Firestore directly.
      refreshGuestDb();
    })();
  </script>
</body>
</html>
