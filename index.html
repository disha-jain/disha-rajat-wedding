<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome — Disha & Rajat (#rishta)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/passcode.css">
</head>
<body class="passcode-body">
  <div class="lights-overlay"></div>

  <div class="passcode-container">
    <div class="card passcode-card">
      <div class="hero-script-heading">#rishta</div>
      <h2 class="gold-title">Welcome</h2>
      <p class="passcode-sub">Please enter the site passcode to access our wedding invitation.</p>
      
      <form onsubmit="handlePasscodeSubmit(event)">
        <div class="form-group">
          <input type="password" id="site-passcode-input" placeholder="Enter Passcode..." autocomplete="off" required>
        </div>
        <button type="submit" class="btn-gold-outline" style="width: 100%;">Enter Site</button>
      </form>
      
      <div id="passcode-error" class="error-msg" style="display: none;">
        Incorrect passcode. Please try again.
      </div>
    </div>
  </div>

  <script>
    if (sessionStorage.getItem("site_unlocked") === "true") {
      window.location.href = "home.html";
    }

    function handlePasscodeSubmit(e) {
      e.preventDefault();
      const input = document.getElementById("site-passcode-input").value.trim();
      const err = document.getElementById("passcode-error");
      
      if (input === "rishta2027") {
        sessionStorage.setItem("site_unlocked", "true");
        window.location.href = "home.html";
      } else {
        err.style.display = "block";
      }
    }
  </script>
</body>
</html>
