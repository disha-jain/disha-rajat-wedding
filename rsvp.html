<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - Disha & Rajat Wedding</title>
    
    <!-- Link to your main styling sheet and the updated rsvp.css -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/rsvp.css">
</head>
<body>

    <div class="phone-wrapper">
        <!-- Calligraphy Banner Headers -->
        <h1 class="cursive-header">Can't wait to party?</h1>
        <h2 class="sub-header">Fill out the RSVP form below and let us know</h2>

        <!-- RSVP Glassmorphic Card Container -->
        <div class="rsvp-card">
            
            <!-- 
              Keep your EXACT <form> declaration, action, 
              and any backend integration (Formspree, Google Sheets, etc.) intact.
            -->
            <form id="rsvp-form" action="#" method="POST">
                <div class="rsvp-title">RSVP</div>

                <!-- Your Name Group (or your existing search/lookup input) -->
                <div class="form-group">
                    <label class="form-label" for="guest-name">Your name</label>
                    <input type="text" id="guest-name" name="name" class="text-input" placeholder="e.g., Jane Doe" required>
                </div>

                <!-- 
                  FAMILY / GROUP MEMBERS RSVP SECTION
                  Keep your exact dynamic looping logic (Jekyll/Liquid/JS) intact here.
                  Simply wrap your generated family members' input rows in these updated classes!
                -->
                <div id="family-members-container">
                    
                    <!-- Loop Start (for each family member in the group) -->
                    <div class="family-member-block" style="margin-top: 24px; border-top: 1px solid rgba(0,0,0,0.08); padding-top: 20px;">
                        <span class="form-label" style="font-size: 14px; font-weight: 800; color: #1a1a1a;">Jane Doe (Family Member 1)</span>
                        
                        <!-- Are they coming? Toggle -->
                        <div class="form-group" style="margin-top: 12px;">
                            <label class="form-label">Are you coming?</label>
                            <div class="option-group">
                                <label class="option-pill">
                                    <input type="radio" name="attending_member1" value="yes" required>
                                    Absolutely, wouldn't miss it!
                                </label>
                                <label class="option-pill">
                                    <input type="radio" name="attending_member1" value="no">
                                    Can't make it this time.
                                </label>
                            </div>
                        </div>

                        <!-- Individual Meal Preference Toggle -->
                        <div class="form-group">
                            <label class="form-label">Meal Preference</label>
                            <div class="option-group">
                                <label class="checkbox-pill">
                                    <input type="checkbox" name="meal_pref_member1" value="vegetarian" checked>
                                    <span class="checkbox-icon"></span>
                                    Vegetarian
                                </label>
                                <label class="checkbox-pill">
                                    <input type="checkbox" name="meal_pref_member1" value="non_vegetarian">
                                    <span class="checkbox-icon"></span>
                                    Non-Vegetarian
                                </label>
                            </div>
                        </div>
                    </div>
                    <!-- Loop End -->

                </div>

                <!-- Leave your wishes -->
                <div class="form-group" style="margin-top: 24px; border-top: 1px solid rgba(0,0,0,0.08); padding-top: 20px;">
                    <label class="form-label" for="guest-wishes">Leave your wishes for the couple</label>
                    <input type="text" id="guest-wishes" name="wishes" class="text-input" placeholder="Wishes...">
                </div>

                <!-- Submit Button (Left Aligned & Styled) -->
                <button type="submit" class="submit-btn">Send Response</button>
            </form>
        </div>
    </div>

</body>
</html>
