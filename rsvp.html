<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - Disha & Rajat Wedding</title>
    
    <!-- Links to your repository stylesheets -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/rsvp.css">
</head>
<body>

    <div class="phone-wrapper">
        <!-- Calligraphy Banner Headers -->
        <h1 class="cursive-header">Can't wait to party?</h1>
        <h2 class="sub-header">Fill out the RSVP form below and let us know</h2>

        <!-- RSVP Styled Glassmorphism Card Container -->
        <div class="rsvp-card">
            <!-- Tip: Replace action URL with your Formspree/Google App Script endpoint -->
            <form id="rsvp-form" action="#" method="POST">
                <div class="rsvp-title">RSVP</div>

                <!-- Your Name Input -->
                <div class="form-group">
                    <label class="form-label" for="guest-name">Your name</label>
                    <input type="text" id="guest-name" name="name" class="text-input" placeholder="e.g., Jane Doe" required>
                </div>

                <!-- Attendance Radio Selection -->
                <div class="form-group">
                    <label class="form-label">Are you coming?</label>
                    <div class="option-group">
                        <label class="option-pill">
                            <input type="radio" name="attending" value="yes" required>
                            Absolutely, wouldn't miss it!
                        </label>
                        <label class="option-pill">
                            <input type="radio" name="attending" value="no">
                            Can't make it this time.
                        </label>
                    </div>
                </div>

                <!-- Guest Count Selection Row -->
                <div class="form-group">
                    <label class="form-label">Number of Guests Attending</label>
                    <div class="guests-row">
                        <label class="guest-pill">
                            <input type="radio" name="guest_count" value="1" required>
                            1
                        </label>
                        <label class="guest-pill">
                            <input type="radio" name="guest_count" value="2">
                            2
                        </label>
                        <label class="guest-pill">
                            <input type="radio" name="guest_count" value="3">
                            3
                        </label>
                        <label class="guest-pill">
                            <input type="radio" name="guest_count" value="4">
                            4
                        </label>
                        <label class="guest-pill">
                            <input type="radio" name="guest_count" value="4+">
                            4+
                        </label>
                    </div>
                </div>

                <!-- Meal Preference Checkboxes -->
                <div class="form-group">
                    <label class="form-label">Meal Preference</label>
                    <div class="option-group">
                        <label class="checkbox-pill">
                            <input type="checkbox" name="meal_pref" value="vegetarian" checked>
                            <span class="checkbox-icon"></span>
                            Vegetarian
                        </label>
                        <label class="checkbox-pill">
                            <input type="checkbox" name="meal_pref" value="non_vegetarian">
                            <span class="checkbox-icon"></span>
                            Non-Vegetarian
                        </label>
                        <label class="checkbox-pill">
                            <input type="checkbox" name="meal_pref" value="no_preference">
                            <span class="checkbox-icon"></span>
                            No Preference
                        </label>
                    </div>
                </div>

                <!-- Wishes Input -->
                <div class="form-group">
                    <label class="form-label" for="guest-wishes">Leave your wishes for the couple</label>
                    <input type="text" id="guest-wishes" name="wishes" class="text-input" placeholder="Wishes...">
                </div>

                <!-- Send Response Call to Action button -->
                <button type="submit" class="submit-btn">Send Response</button>
            </form>
        </div>
    </div>

</body>
</html>
