<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSVP — Disha & Rajat (#rishta)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/rsvp.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <style>
    body {
      background:
        radial-gradient(circle at 20% 10%, rgba(201,169,97,0.12), transparent 45%),
        radial-gradient(circle at 80% 90%, rgba(201,169,97,0.08), transparent 45%),
        var(--ivory);
      min-height: 100vh;
      font-family: var(--font-sans);
    }
    .cursive-header { color: var(--gold-dark) !important; text-shadow: none !important; }
    .sub-header { color: var(--dark-gray) !important; text-shadow: none !important; }
    .rsvp-card { border: 1px solid var(--line) !important; box-shadow: var(--shadow-soft) !important; }
  </style>
</head>
<body>
  <script src="js/guest-auth.js"></script>
  <script>
    if (!window.GuestAuth.requireUnlock()) {
      // redirecting
    } else {
      document.addEventListener('DOMContentLoaded', () => window.GuestAuth.renderNav());
    }
  </script>

  <nav>
    <a href="home.html">Home</a>
    <a href="schedule.html">Events</a>
    <a href="rsvp.html" class="active">RSVP</a>
    <a href="travel-us.html" id="nav-travel-us" style="display:none;">US Travel & Lodging</a>
    <a href="travel-india.html" id="nav-travel-india" style="display:none;">India Travel</a>
    <a href="admin.html">Host Admin</a>
  </nav>

  <div class="phone-wrapper">
    <div class="cursive-header">Can't wait to party?</div>
    <div class="sub-header">Fill out the RSVP<br>form below and let us<br>know</div>

    <div class="rsvp-card">
      <div class="rsvp-title">RSVP</div>

      <form id="rsvp-form" onsubmit="handleRSVPSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="rsvp-name">Your name</label>
          <input class="text-input" type="text" id="rsvp-name" placeholder="" required>
        </div>

        <div class="form-group">
          <label class="form-label">Are you coming?</label>
          <label class="option-pill"><input type="radio" name="attending" value="yes" required><span>Absolutely, wouldn't miss it!</span></label>
          <div style="height:8px"></div>
          <label class="option-pill"><input type="radio" name="attending" value="no" required><span>Can't make it this time.</span></label>
        </div>

        <div class="form-group">
          <label class="form-label">Number of Guests Attending</label>
          <div class="guests-row">
            <label class="guest-pill"><input type="radio" name="guest_count" value="1" checked><span>1</span></label>
            <label class="guest-pill"><input type="radio" name="guest_count" value="2"><span>2</span></label>
            <label class="guest-pill"><input type="radio" name="guest_count" value="3"><span>3</span></label>
            <label class="guest-pill"><input type="radio" name="guest_count" value="4"><span>4</span></label>
            <label class="guest-pill"><input type="radio" name="guest_count" value="5+"><span>5+</span></label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Meal Preference</label>
          <label class="checkbox-pill"><input type="checkbox" name="meal" value="vegetarian" checked><span class="checkbox-icon"></span><span>Vegetarian</span></label>
          <div style="height:8px"></div>
          <label class="checkbox-pill"><input type="checkbox" name="meal" value="non-vegetarian"><span class="checkbox-icon"></span><span>Non-Vegetarian</span></label>
          <div style="height:8px"></div>
          <label class="checkbox-pill"><input type="checkbox" name="meal" value="no-preference"><span class="checkbox-icon"></span><span>No Preference</span></label>
        </div>

        <div class="form-group">
          <label class="form-label" for="rsvp-wishes">Leave your wishes for the couple</label>
          <input class="text-input" type="text" id="rsvp-wishes" placeholder="">
        </div>

        <div style="text-align:center;">
          <button class="submit-btn" type="submit">Send Response</button>
        </div>
      </form>

      <div id="rsvp-success" style="display:none; text-align:center; padding:20px 0;">
        <div style="font-size:20px; font-weight:800; margin-bottom:10px;">Thank you!</div>
        <div style="font-size:14px;">Your response has been saved.<br>We can't wait to celebrate with you!</div>
      </div>
    </div>
  </div>

  <footer>
    DISHA & RAJAT • #RISHTA • 2027
  </footer>

  <script>
    const masterEvents = [
      { id: 'e1', title: 'Welcome Lunch & Mehendi', date: 'March 13, 2027', tags: ['india-guest'] },
      { id: 'e2', title: "Disha's Tel Ban", date: 'March 13, 2027', tags: ['india-guest', 'bride-side'] },
      { id: 'e3', title: 'Sangeet', date: 'March 13, 2027', tags: ['india-guest'] },
      { id: 'e4', title: "Rajat's Tel Haldi", date: 'March 14, 2027', tags: ['india-guest', 'groom-side'] },
      { id: 'e5', title: "Disha's Gaur Puja & Phoolon Ki Haldi", date: 'March 14, 2027', tags: ['india-guest', 'bride-side'] },
      { id: 'e6', title: 'Shaadi (Wedding Ceremony)', date: 'March 14, 2027', tags: ['india-guest'] },
      { id: 'e7', title: 'Wedding Reception', date: 'March 27, 2027', tags: ['us-guest'] }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const famName = sessionStorage.getItem('family_name') || '';
      const code = sessionStorage.getItem('family_code') || '';
      const db = window.GuestAuth.getGuestDatabase();
      const fam = db.find(f => f.family_code === code);
      if (fam && fam.members && fam.members.length === 1) {
        document.getElementById('rsvp-name').value = fam.members[0].first_name + ' ' + fam.members[0].last_name;
      } else if (famName) {
        document.getElementById('rsvp-name').value = famName.replace(' Family','');
      }
    });

    function handleRSVPSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('rsvp-name').value.trim();
      const attending = document.querySelector('input[name="attending"]:checked');
      const guestCount = document.querySelector('input[name="guest_count"]:checked');
      const meals = [...document.querySelectorAll('input[name="meal"]:checked')].map(i => i.value);
      const wishes = document.getElementById('rsvp-wishes').value.trim();

      if (!name || !attending) return;

      const familyCode = sessionStorage.getItem('family_code') || 'GUEST';
      const familyName = sessionStorage.getItem('family_name') || name;
      const tags = JSON.parse(sessionStorage.getItem('guest_tags') || '[]');
      const allowedEvents = masterEvents.filter(ev => ev.tags.some(t => tags.includes(t)));

      const status = attending.value === 'yes' ? 'attending' : 'declining';
      const dietary = meals.join(', ') + (wishes ? ' | Wishes: ' + wishes : '');

      const existing = JSON.parse(localStorage.getItem('wedding_rsvps_database') || '[]');
      const timestamp = new Date().toISOString();

      const eventsToSave = allowedEvents.length ? allowedEvents : [{id:'general', title:'General'}];
      eventsToSave.forEach(evt => {
        const record = {
          family_code: familyCode,
          family_name: familyName,
          guest_name: name,
          event_id: evt.id,
          event_title: evt.title,
          status: status,
          guest_count: guestCount ? guestCount.value : '1',
          dietary_notes: dietary,
          timestamp
        };
        existing.push(record);
        if (typeof db !== 'undefined' && db !== null) {
          db.collection('rsvps').add(record).catch(()=>{});
        }
      });
      localStorage.setItem('wedding_rsvps_database', JSON.stringify(existing));

      document.getElementById('rsvp-form').style.display = 'none';
      document.getElementById('rsvp-success').style.display = 'block';
      window.scrollTo({top:0, behavior:'smooth'});
    }
  </script>
</body>
</html>
