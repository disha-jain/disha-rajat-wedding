<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule — Disha & Rajat (#rishta)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/schedule.css">
</head>
<body>
  <script>
    if (sessionStorage.getItem("site_unlocked") !== "true") {
      window.location.href = "index.html";
    }
  </script>

  <div class="lights-overlay"></div>

  <nav>
    <a href="home.html">Home</a>
    <a href="schedule.html" class="active">Events</a>
    <a href="rsvp.html">RSVP</a>
    <a href="travel-us.html" id="nav-travel-us" style="display:none;">US Travel & Lodging</a>
    <a href="travel-india.html" id="nav-travel-india" style="display:none;">India Travel</a>
    <a href="admin.html">Host Admin</a>
  </nav>

  <div class="container">
    <h2 class="section-title">Schedule of Events</h2>
    <div id="events-container"></div>
  </div>

  <footer>
    DISHA & RAJAT • #RISHTA • 2027
  </footer>

  <script>
    const masterEvents = [
      { id: 'e1', title: 'Welcome Lunch & Mehendi', date: 'March 13, 2027', time: 'Afternoon', location: 'Chomu Palace, Rajasthan', tags: ['india-guest'] },
      { id: 'e2', title: "Disha's Tel Ban", date: 'March 13, 2027', time: 'Late Afternoon', location: 'Chomu Palace, Rajasthan', tags: ['india-guest', 'bride-side'] },
      { id: 'e3', title: 'Sangeet', date: 'March 13, 2027', time: 'Evening', location: 'Chomu Palace, Rajasthan', tags: ['india-guest'] },
      { id: 'e4', title: "Rajat's Tel Haldi", date: 'March 14, 2027', time: 'Morning', location: 'Chomu Palace, Rajasthan', tags: ['india-guest', 'groom-side'] },
      { id: 'e5', title: "Disha's Gaur Puja & Phoolon Ki Haldi", date: 'March 14, 2027', time: 'Morning', location: 'Chomu Palace, Rajasthan', tags: ['india-guest', 'bride-side'] },
      { id: 'e6', title: 'Shaadi (Wedding Ceremony)', date: 'March 14, 2027', time: 'Evening', location: 'Chomu Palace, Rajasthan', tags: ['india-guest'] },
      { id: 'e7', title: 'Wedding Reception', date: 'March 27, 2027', time: '6:00 PM - 12:00 AM', location: 'The Bellevue, Chantilly, Virginia', tags: ['us-guest'] }
    ];

    const tags = JSON.parse(sessionStorage.getItem("guest_tags") || '["india-guest", "us-guest"]');
    const storedTags = JSON.parse(sessionStorage.getItem("guest_tags") || "[]");
    if (storedTags.includes("us-guest")) {
      const el = document.getElementById("nav-travel-us");
      if (el) el.style.display = "inline-block";
    }
    if (storedTags.includes("india-guest")) {
      const el = document.getElementById("nav-travel-india");
      if (el) el.style.display = "inline-block";
    }

    const container = document.getElementById("events-container");
    const allowed = masterEvents.filter(e => e.tags.some(t => tags.includes(t)));

    allowed.forEach(evt => {
      const card = document.createElement("div");
      card.className = "card event-card";
      card.innerHTML = `
        <h3 class="gold-title">${evt.title}</h3>
        <p class="event-time">${evt.date} • ${evt.time}</p>
        <p class="event-location">${evt.location}</p>
      `;
      container.appendChild(card);
    });
  </script>
</body>
</html>
