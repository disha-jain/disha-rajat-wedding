<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule — Disha & Rajat (#rishta)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: #f6f1e8; color: #2b2b2b; font-family: 'Plus Jakarta Sans', sans-serif; }
    .lights-overlay { display:none; }
    nav { background: rgba(10,10,12,0.92); }
    .schedule-wrap { max-width: 420px; margin: 0 auto; padding: 24px 18px 50px; position: relative; }
    .wedding-kicker { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 36px; letter-spacing: 1px; color: #1a1a1a; }
    .schedule-script { font-family: 'Great Vibes', cursive; font-size: 52px; color: #8a6d3b; margin: -12px 0 20px; }
    .timeline { position: relative; margin-top: 10px; }
    .timeline-item { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid rgba(0,0,0,0.06); }
    .timeline-item:last-child { border-bottom: none; }
    .timeline-icon { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #fff; border: 1px solid #e8ddd0; display:flex; align-items:center; justify-content:center; font-size:20px; }
    .timeline-time { font-weight: 800; font-size: 15px; color: #1a1a1a; letter-spacing: 0.3px; }
    .timeline-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #6b5d4f; margin-top: 2px; }
    .timeline-date { font-size: 12px; color: #8a7a68; margin-top: 6px; }
    .floral { position: absolute; right: -10px; bottom: 20px; width: 140px; opacity: 0.9; pointer-events:none; }
    footer { background:#1e1a16; color:#d8cfbd; border-top:none; }
  </style>
</head>
<body>
  <script src="js/guest-auth.js"></script>
  <script>
    if (!window.GuestAuth.requireUnlock()) {} else {
      document.addEventListener('DOMContentLoaded', () => { window.GuestAuth.renderNav(); renderSchedule(); });
    }
  </script>

  <nav>
    <a href="home.html">Home</a>
    <a href="schedule.html" class="active">Events</a>
    <a href="rsvp.html">RSVP</a>
    <a href="travel-us.html" id="nav-travel-us" style="display:none;">US Travel & Lodging</a>
    <a href="travel-india.html" id="nav-travel-india" style="display:none;">India Travel</a>
    <a href="admin.html">Host Admin</a>
  </nav>

  <div class="schedule-wrap">
    <div class="wedding-kicker">WEDDING</div>
    <div class="schedule-script">Schedule</div>

    <div class="timeline" id="timeline"></div>

    <svg class="floral" viewBox="0 0 100 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 10 C60 40 75 60 50 80 C25 60 40 40 50 10Z" stroke="#8a6d3b" stroke-width="1.2" fill="#f9f3e8"/>
      <path d="M50 80 C62 100 70 120 50 150 C30 120 38 100 50 80Z" stroke="#8a6d3b" stroke-width="1.2" fill="#f1e6d2"/>
      <circle cx="50" cy="80" r="4" fill="#8a6d3b"/>
    </svg>
  </div>

  <footer>
    DISHA & RAJAT • #RISHTA • 2027
  </footer>

  <script>
    const masterEvents = [
      { id: 'e1', title: 'Wedding Ceremony', date: 'March 14, 2027', time: '3:30 PM', icon: '💒', tags: ['india-guest'] },
      { id: 'e2', title: 'Photo Hour', date: 'March 14, 2027', time: '5:30 PM', icon: '📸', tags: ['india-guest'] },
      { id: 'e3', title: 'Cocktail Hour', date: 'March 14, 2027', time: '6:30 PM', icon: '🍸', tags: ['india-guest'] },
      { id: 'e4', title: 'Dance Party', date: 'March 14, 2027', time: '8:00 PM', icon: '💃', tags: ['india-guest'] },
      { id: 'e7', title: 'Wedding Reception', date: 'March 27, 2027', time: '6:00 PM', icon: '🥂', tags: ['us-guest'] },
      { id: 'e1b', title: 'Welcome Lunch & Mehendi', date: 'March 13, 2027', time: '12:00 PM', icon: '🌿', tags: ['india-guest'] },
      { id: 'e3b', title: 'Sangeet', date: 'March 13, 2027', time: '7:00 PM', icon: '🎶', tags: ['india-guest'] }
    ];

    function renderSchedule() {
      const tags = JSON.parse(sessionStorage.getItem('guest_tags') || '["india-guest","us-guest"]');
      const allowed = masterEvents.filter(e => e.tags.some(t => tags.includes(t)));
      const container = document.getElementById('timeline');
      if (!allowed.length) {
        container.innerHTML = '<p style="text-align:center; color:#8a7a68;">Details coming soon.</p>';
        return;
      }
      // Sort by date/time roughly as defined
      container.innerHTML = allowed.map(evt => `
        <div class="timeline-item">
          <div class="timeline-icon">${evt.icon}</div>
          <div>
            <div class="timeline-time">${evt.time}</div>
            <div class="timeline-label">${evt.title}</div>
            <div class="timeline-date">${evt.date}</div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
